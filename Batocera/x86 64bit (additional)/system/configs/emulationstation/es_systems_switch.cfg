<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
        <fullname>Nintendo Switch</fullname>
        <name>switch</name>
        <manufacturer>Nintendo</manufacturer>
        <release>2017</release>
        <hardware>console</hardware>
        <path>/userdata/roms/switch</path>
        <extension>.nro .NRO .xci .XCI .nsp .NSP .nsz .NSZ</extension>
        <command>python /userdata/system/rgs/emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM%</command>
        <platform>switch</platform>
        <theme>switch</theme>
        <emulators>
            <emulator name="eden">
                <cores>
                    <core default="true">eden</core>
                </cores>
            </emulator>
            <emulator name="eden-pgo">
                <cores>
                    <core default="true">eden-pgo</core>
                </cores>
            </emulator>
            <emulator name="eden-legacy">
                <cores>
                    <core default="true">eden-legacy</core>
                </cores>
            </emulator>
            <emulator name="citron">
                <cores>
                    <core>citron</core>
                </cores>
            </emulator>
            <emulator name="citron-legacy">
                <cores>
                    <core>citron-legacy</core>
                </cores>
            </emulator>
            <emulator name="ryujinx">
                <cores>
                    <core>ryujinx</core>
                </cores>
            </emulator>

        </emulators>
  </system>

</systemList>
