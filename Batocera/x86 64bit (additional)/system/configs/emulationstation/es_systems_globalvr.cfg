<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
    <fullname>Global VR</fullname>
    <name>globalvr</name>
    <manufacturer>Global VR</manufacturer>
    <release>2001</release>
    <hardware>arcade</hardware>
    <path>/userdata/roms/globalvr</path>
    <extension>.pc .wsquashfs .wine .squashfs</extension>
    <command>/userdata/system/rgs/emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>arcade</platform>
    <theme>globalvr</theme>
        <emulators>
            <emulator name="wine">
                <cores>
                    <core default="true">wine-tkg</core>
                </cores>
            </emulator>
            <emulator name="linuxloader">
                <cores>
                    <core>linuxloader</core>
                </cores>
            </emulator>
            <emulator name="windows-arcade-loader">
                <cores>
                    <core>windows-arcade-loader</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
