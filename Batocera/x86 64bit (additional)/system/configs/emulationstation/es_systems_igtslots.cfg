<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
        <fullname>IGT slots (fruit machines)</fullname>
        <name>igtslots</name>
        <manufacturer>International Game Technology</manufacturer>
        <release>2017</release>
        <hardware>pinball</hardware>
        <path>/userdata/roms/igtslots</path>
        <extension>.bat</extension>
        <command>python3 /userdata/system/rgs/emulatorlauncher %CONTROLLERSCONFIG% -system igtslots -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>arcade</platform>
        <theme>igtslots</theme>
        <emulators>
            <emulator name="winebat">
                <cores>
                    <core default="true">wine-tkg</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
