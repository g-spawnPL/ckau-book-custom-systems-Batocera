<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
    <fullname>N-Gage</fullname>
	<name>ngage</name>
    <manufacturer>Nokia</manufacturer>
    <release>2003</release>
    <hardware>portable</hardware>
    <path>/userdata/roms/ngage</path>
 	<extension>.ngage .n-gage</extension>
	<command>/userdata/system/rgs/emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>ngage</platform>
    <theme>ngage</theme>
        <emulators>
            <emulator name="eka2l1">
                <cores>
                    <core default="true">eka2l1</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>
