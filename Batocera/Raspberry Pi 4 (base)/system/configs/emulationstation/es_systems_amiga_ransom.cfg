<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
  <system>
        <fullname>Amiga by Ransom</fullname>
        <name>amiga_ransom</name>
        <manufacturer>Commodore</manufacturer>
        <release>1992</release>
        <hardware>computer</hardware>
        <path>/userdata/roms/amiga_ransom</path>
        <extension>.uae</extension>
        <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>amiga</platform>
        <theme>amiga_ransom</theme>
        <group>amiga</group>
        <emulators>
            <emulator name="amiberry">
                <cores>
                    <core incompatible_extensions=".m3u">A1200</core>
                    <core incompatible_extensions=".m3u">A4000</core>
                </cores>
            </emulator>
        </emulators>
  </system>
</systemList>

