<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
        <system>
        <fullname>Pippin @mark</fullname>
        <name>pippin</name>
        <manufacturer>Apple</manufacturer>
        <release>1986</release>
        <hardware>console</hardware>
        <path>/userdata/roms/pippin</path>
        <extension>.bat </extension>
        <command>python3 /userdata/system/rgs/emulatorlauncher %CONTROLLERSCONFIG% -system pippin -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>pippin</platform>
        <theme>pippin</theme>
        <emulators>
            <emulator name="winebat">
                <cores>
                    <core default="true">wine-tkg</core>
                </cores>
            </emulator>
        </emulators>
  </system>
 </systemList>
